# Identifies the Spring Boot application
spring.application.name=civiclens

# Configures the connection to PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/civiclens
spring.datasource.username=civiclens_app
spring.datasource.password=${CIVICLENS_DB_PASSWORD}

# Prevents database queries outside the service transaction boundary
spring.jpa.open-in-view=false

# Validate JPA mappings against the Flyway-managed schema without modifying it
spring.jpa.hibernate.ddl-auto=validate
